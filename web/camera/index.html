<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f2e9"><title>TofuCam</title><link rel="stylesheet" href="styles.css"></head><body><main class="page">
<header class="masthead"><a class="brand" href="#" aria-label="TofuCam home"><span class="mark" aria-hidden="true"></span><span><strong>TOFUCAM</strong><small>microSD photo shelf</small></span></a><div class="status" id="connection"><i></i><span>connecting…</span></div></header>
<section class="intro"><div><p class="eyebrow">TWO CAMERAS · TWO CARDS</p><h1>Saved photographs</h1><p>Select photographs from either card and download the originals.</p></div><div class="toolbar"><label><input type="checkbox" id="selectAll"> Select all</label><span id="selectionCount">0 selected</span><button id="refresh">Refresh</button><button class="download" id="downloadSelected" disabled>Download selected</button></div></section>
<section class="card-section" aria-labelledby="frontTitle"><header><div><span class="card-number">01</span><h2 id="frontTitle">Front camera</h2></div><span class="card-state" id="outwardState">Reading card…</span></header><div class="gallery" id="outwardGallery"><p class="empty">Reading the front microSD card…</p></div></section>
<section class="card-section" aria-labelledby="selfieTitle"><header><div><span class="card-number">02</span><h2 id="selfieTitle">Selfie camera</h2></div><span class="card-state" id="selfieState">Reading card…</span></header><div class="gallery" id="selfieGallery"><p class="empty">Reading the selfie microSD card…</p></div></section>
</main><div class="viewer" id="viewer" hidden><button class="viewer-close" id="viewerClose" type="button" aria-label="Close enlarged view">×</button><img id="viewerImage" alt="Enlarged photograph"></div><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
